services:
  - type: web
    name: campus-os-fullstack
    runtime: node
    plan: free
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: USE_MOCK_SERVICES
        value: "true"
      - key: DATABASE_URL
        sync: false # Set manually in Render dashboard
      - key: NEXT_PUBLIC_API_BASE_URL
        value: "" # Empty means relative to the current domain
